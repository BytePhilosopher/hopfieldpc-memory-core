# Trainable Hopfield memory on MNIST. Seeds, splits, test grids, frozen backbones and the initial
# memory design come from source_config. The fixed betas and the memory tuning below are read from
# benchmarks/mnist/tuned_params.json (written once by `python -m benchmarks.mnist.tuning`).
source_config: "configs/mnist/hopfield.yaml"
l5_config: "configs/mnist/hopfield_l5.yaml"
# Optional: the L5 experiment's results, used only to check that the fixed L5 model repeats them.
fixed_results: "reports/mnist_l5_hopfield/results.json"
reports_dir: "reports/mnist_trainable_hopfield"

# The same budget and noise for every trained model. Each batch is split into thirds: clean,
# Gaussian and salt-and-pepper at one level drawn per batch. No level is in the test grids.
# Occlusion is never trained on, so it stays an unseen corruption.
train_gaussian_sigmas: [0.15, 0.25, 0.4]
train_salt_pepper_probs: [0.075, 0.15, 0.25]
memory_epochs: 3          # Stage A: memory and beta only
finetune_epochs: 3        # Stage B: memory, beta and L6-L9; also the baselines' budget
backbone_lr: 0.0003
beta_lr: 0.01             # on log(beta)
cluster_weight: 0.1       # pull toward the closest prototype of the true class
separation_weight: 0.01   # push away from the closest prototype of another class
center_ema: 0.99          # L8 only in Stage B: L6-L7 move z, so the center follows it

# Grid on one seed, scored on validation data only (run by benchmarks.mnist.tuning, stored once).
tuning:
  seed: 0
  train_images: 10000
  epochs: 2
  memory_lr_values: [0.0003, 0.001, 0.003]
  beta_factors: [0.2, 1.0]   # initial beta = factor x the fixed model's beta

cost:
  batch_size: 256
  repeats: 3
  warmup: 3
  iters: 30

quick:
  fixed_results: "reports/mnist_l5_hopfield_quick/results.json"
  reports_dir: "reports/mnist_trainable_hopfield_quick"
  memory_epochs: 1
  finetune_epochs: 1
  tuning:
    seed: 0
    train_images: 1000
    epochs: 1
    memory_lr_values: [0.001]
    beta_factors: [1.0]
  cost:
    batch_size: 32
    repeats: 1
    warmup: 1
    iters: 3
